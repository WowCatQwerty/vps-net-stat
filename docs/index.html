<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // The page uses a JS-driven full-screen slide between hero and demo (see
  // demo.js — wheel and touch swipe both drive an explicit multi-second
  // CSS transform transition, not the browser's built-in smooth-scroll,
  // since that can't be made to last a couple of seconds). We strip any
  // #hash from the URL immediately, before layout, so a stale #demo from a
  // previous visit or a shared link doesn't cause the browser to
  // auto-scroll before demo.js has even run. The page always loads on the
  // hero slide — no special-cased "jump straight to #demo" behavior, since
  // that required briefly disabling the CSS transition and relying on
  // requestAnimationFrame to re-enable it, and rAF is paused by browsers
  // in backgrounded/inactive tabs — if the tab wasn't focused at exactly
  // the right moment, the transition could stay disabled for the rest of
  // the session, making every later slide change look instant regardless
  // of how it was triggered. Simpler and more robust to just not do that.
  if (location.hash){
    history.replaceState(null, "", location.pathname + location.search);
  }
  if ("scrollRestoration" in history){
    history.scrollRestoration = "manual";
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vps-net-stat — interactive demo menu</title>
<meta name="description" content="Live interactive demo of the vps-net-stat menu — a traffic and port monitor for Linux servers, right in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230f1115%22/><path d=%22M20 65 L38 35 L52 55 L65 30 L80 60%22 stroke=%22%234a9eff%22 stroke-width=%228%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:            #0a0c10;
    --bg-glow-1:     #131a2b;
    --bg-glow-2:     #0d1420;
    --panel:         #14171d;
    --panel-2:       #191d24;
    --border:        #262a33;
    --border-soft:   #1d2028;
    --text:          #e8eaed;
    --text-dim:      #8b909c;
    --text-faint:    #565b66;
    --accent:        #4a9eff;
    --accent-dim:    #2f6fb8;
    --accent-glow:   rgba(74,158,255,.35);
    --ok:            #3ecf8e;
    --warn:          #e8b339;
    --err:           #e2555a;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  *{box-sizing:border-box;}
  html{ overflow:hidden; height:100%; } /* #slideTrack below owns all scrolling via JS transform */
  body{
    margin:0;
    overflow:hidden;
    height:100vh;
    height:100dvh; /* mobile browsers report 100vh as if chrome (address bar) is hidden — dvh tracks the actually-visible area */
    background: var(--bg);
    color:var(--text);
    font-family:var(--mono);
  }

  /* ── Slide track: two full-height screens, JS drives the transform (see
     demo.js) with an explicit multi-second transition. Wheel AND touch
     swipe both call the same goToSlide() — wheel events never fire for
     touch scrolling, so relying on `wheel` alone would silently break
     navigation on mobile. ─────────────────────────────────────────── */
  #slideTrack{
    width:100%;
    height:200vh;
    transition: transform 1.7s cubic-bezier(.65,0,.35,1);
    will-change: transform;
  }
  .slide-screen{
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    background:
      radial-gradient(ellipse 900px 600px at 15% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(ellipse 800px 500px at 105% 10%, var(--bg-glow-2), transparent 55%),
      var(--bg);
    overflow:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    /* #slideTrack is deliberately excluded — its hero⇄demo glide is a core
       part of the site's presentation, not a decorative flourish, and the
       person viewing this demo (the site owner testing it, or any visitor)
       should always see it regardless of their OS-level motion preference.
       Everything else on the page still respects prefers-reduced-motion
       normally. */
    *:not(#slideTrack){animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }

  /* ── Hero section (first screen) ───────────────────────── */
  .hero{
    padding:24px 16px;
    overflow-y:auto; /* if content is taller than viewport on small screens, scroll internally instead of breaking the slide */
  }
  .hero-lang-btn{
    position:absolute;
    top:20px;
    right:20px;
    display:inline-flex;
    align-items:center;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    transition:transform .15s ease, border-color .15s ease, color .15s ease, background .15s ease;
  }
  .hero-lang-btn:hover{ border-color:var(--accent-dim); color:var(--accent); transform:translateY(-1px); }
  .hero-inner{
    width:100%;
    max-width:820px;
    text-align:center;
  }
  .hero-mark{
    width:64px;height:64px;border-radius:16px;
    background:linear-gradient(155deg, #1b2130, #10141c);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 26px;
    box-shadow: 0 0 40px -12px var(--accent-glow);
  }
  .hero-mark svg{ width:32px; height:32px; }
  .hero-title{
    font-size:38px;
    font-weight:700;
    letter-spacing:-.02em;
    margin:0 0 14px;
    color:var(--text);
  }
  .hero-title .accent-word{ color:var(--accent); }
  .hero-tagline{
    font-size:16px;
    color:var(--text-dim);
    line-height:1.65;
    max-width:620px;
    margin:0 auto 28px;
  }
  .hero-tagline b{ color:var(--text); font-weight:600; }

  .hero-badges{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:40px;
  }
  .hero-badge{
    font-size:11.5px;
    padding:5px 12px;
    border-radius:999px;
    border:1px solid var(--border);
    color:var(--text-dim);
    background:var(--panel);
    letter-spacing:.02em;
  }
  .hero-badge.accent-badge{ color:var(--accent); border-color:var(--accent-dim); }

  .hero-features{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    margin-bottom:44px;
    text-align:left;
  }
  .feature-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:18px 18px 16px;
  }
  .feature-icon{
    width:30px;height:30px;
    border-radius:8px;
    background:#ffffff08;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:12px;
    color:var(--accent);
  }
  .feature-icon svg{ width:16px; height:16px; }
  .feature-title{
    font-size:13.5px;
    font-weight:700;
    color:var(--text);
    margin-bottom:6px;
  }
  .feature-desc{
    font-size:12px;
    color:var(--text-dim);
    line-height:1.55;
  }

  .hero-links{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:56px;
  }
  .hero-btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 20px;
    border-radius:10px;
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    letter-spacing:.01em;
    cursor:pointer;
    border:1px solid var(--border);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    -webkit-appearance:none;
    appearance:none;
  }
  .hero-btn:hover{ transform:translateY(-1px); }
  .hero-btn.primary{
    background:var(--accent);
    color:#0a0c10;
    border-color:var(--accent);
  }
  .hero-btn.primary:hover{ background:#66aeff; }
  .hero-btn.secondary{
    background:var(--panel);
    color:var(--text);
  }
  .hero-btn.secondary:hover{ border-color:var(--accent-dim); color:var(--accent); }

  .scroll-cue{
    position:absolute;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:var(--text-faint);
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-decoration:none;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    font-family:var(--mono);
    animation:scrollBounce 2.2s ease-in-out infinite;
  }
  .scroll-cue:hover{ color:var(--text-dim); }
  .scroll-cue svg{ width:18px; height:18px; }
  @keyframes scrollBounce{
    0%, 100% { transform:translateX(-50%) translateY(0); }
    50% { transform:translateX(-50%) translateY(6px); }
  }

  @media (max-width:720px){
    .hero-features{ grid-template-columns:1fr; gap:10px; }
    .hero-title{ font-size:26px; }
    .hero-tagline{ font-size:14px; margin-bottom:20px; }
    .hero-mark{ width:52px; height:52px; margin-bottom:18px; }
    .hero-mark svg{ width:26px; height:26px; }
    .hero-badges{ margin-bottom:26px; gap:6px; }
    .hero-badge{ font-size:10.5px; padding:4px 10px; }
    .hero-features{ margin-bottom:26px; }
    .feature-card{ padding:14px 16px 13px; }
    .hero-links{ margin-bottom:16px; }
    .hero-lang-btn{ top:14px; right:14px; padding:6px 12px; font-size:11px; }
    /* The scroll cue overlaps hand-scrolled content on small screens where
       the hero doesn't fit in one viewport — hide it here; touch users
       scroll directly, they don't need the hint or the wheel-slide affordance. */
    .scroll-cue{ display:none; }
  }

  @media (max-width:480px), (max-height:700px){
    .hero{ padding:16px 14px; }
    .hero-mark{ width:42px; height:42px; margin-bottom:12px; }
    .hero-mark svg{ width:20px; height:20px; }
    .hero-title{ font-size:21px; margin-bottom:8px; }
    .hero-tagline{ font-size:12.5px; line-height:1.5; margin-bottom:14px; }
    .hero-tagline br{ display:none; }
    .hero-badges{ margin-bottom:16px; gap:5px; }
    .hero-badge{ font-size:10px; padding:3px 8px; }
    .hero-features{ gap:8px; margin-bottom:16px; }
    .feature-card{ padding:11px 13px 10px; }
    .feature-icon{ width:24px; height:24px; margin-bottom:8px; }
    .feature-icon svg{ width:13px; height:13px; }
    .feature-title{ font-size:12.5px; margin-bottom:4px; }
    .feature-desc{ font-size:11px; }
    .hero-links{ margin-bottom:10px; gap:8px; }
    .hero-btn{ padding:9px 16px; font-size:12px; }
  }

  /* ── Demo section (second screen) ──────────────────────── */
  .demo-section{
    padding:20px 16px 40px;
    overflow-y:auto; /* on small screens, the header+terminal stack can exceed 100vh */
  }

  /* ── Header ─────────────────────────────────────────── */
  .page-head{
    width:100%;
    max-width:900px;
    margin-bottom:28px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg, #1b2130, #10141c);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{
    font-size:17px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .brand-link{
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .brand-link:hover{
    color:var(--accent);
    border-bottom-color:var(--accent-dim);
  }
  .brand-tag{
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:500;
  }

  /* ── Terminal card ──────────────────────────────────── */
  .term-wrap{
    width:100%;
    max-width:900px;
  }
  .term-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.02) inset,
      0 30px 60px -25px rgba(0,0,0,.7),
      0 0 80px -40px var(--accent-glow);
  }
  .term-titlebar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background:var(--panel-2);
    border-bottom:1px solid var(--border-soft);
  }
  .term-dots{ display:flex; gap:7px; }
  .term-dots span{ width:11px;height:11px;border-radius:50%; display:block; }
  .term-dots span:nth-child(1){ background:#e2555a55; border:1px solid #e2555a99; }
  .term-dots span:nth-child(2){ background:#e8b33955; border:1px solid #e8b33999; }
  .term-dots span:nth-child(3){ background:#3ecf8e55; border:1px solid #3ecf8e99; }
  .term-title{
    font-size:12px;
    color:var(--text-dim);
    display:flex; align-items:center; gap:7px;
    user-select:none;
  }
  .term-title b{ color:var(--text); font-weight:600; }
  .term-actions{ display:flex; gap:14px; }
  .term-actions button{
    background:none;border:none;color:var(--text-faint);
    font-family:var(--mono); font-size:11px; cursor:pointer;
    padding:4px 8px; border-radius:6px; letter-spacing:.02em;
  }
  .term-actions button:hover{ color:var(--text); background:#ffffff08; }

  .term-body{
    padding:16px 18px 14px;
    height:calc(100vh - 220px);
    height:calc(100dvh - 220px);
    min-height:520px;
    max-height:900px;
    overflow-y:auto;
    font-size:12px;
    line-height:1.42;
    scroll-behavior:smooth;
  }
  .term-body::-webkit-scrollbar{ width:9px; }
  .term-body::-webkit-scrollbar-track{ background:transparent; }
  .term-body::-webkit-scrollbar-thumb{ background:#2a2f3a; border-radius:8px; }
  .term-body::-webkit-scrollbar-thumb:hover{ background:#3a4150; }

  .line{ white-space:pre-wrap; word-break:break-word; }
  .line.gap{ line-height:.85; }
  .menu-title-box{
    display:inline-block;
    border:1px solid #3a4150;
    border-radius:4px;
    padding:3px 14px;
    font-weight:700;
    color:var(--text);
    letter-spacing:.01em;
  }
  .line.dim{ color:var(--text-dim); }
  .line.faint{ color:var(--text-faint); }
  .line.ok{ color:var(--ok); }
  .line.warn{ color:var(--warn); }
  .line.err{ color:var(--err); }
  .line.accent{ color:var(--accent); }
  .line b{ font-weight:700; color:var(--text); }
  .rule{ color:var(--text-faint); }

  .prompt-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:6px;
    position:relative;
  }
  .prompt-sigil{ color:var(--accent); font-weight:700; user-select:none; }
  .prompt-input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--mono);
    font-size:13.5px;
    caret-color:var(--accent);
  }
  .prompt-input::placeholder{ color:var(--text-faint); }

  .term-hint{
    padding:9px 20px;
    border-top:1px solid var(--border-soft);
    background:var(--panel-2);
    font-size:11.3px;
    color:var(--text-faint);
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .term-hint kbd{
    font-family:var(--mono);
    background:#ffffff0a;
    border:1px solid var(--border);
    border-radius:5px;
    padding:1px 6px;
    color:var(--text-dim);
    font-size:10.5px;
  }

  /* progress bar re-usable */
  .bar-track{ color:var(--text-faint); }
  .bar-fill-g{ color:var(--ok); }
  .bar-fill-y{ color:var(--warn); }
  .bar-fill-r{ color:var(--err); }

  @media (max-width:600px){
    .demo-section{ padding-top:36px; }
    .term-body{
      height:calc(100vh - 190px);
      height:calc(100dvh - 190px);
      min-height:380px;
      padding:16px 14px;
      font-size:12.6px;
    }
    .term-titlebar{ padding:10px 12px; }
    .brand-name{ font-size:15px; }
  }
</style>
</head>
<body>

<div id="slideTrack">
  <section class="slide-screen hero" id="hero">
    <button class="hero-lang-btn" id="heroLangBtn" type="button">RU</button>
    <div class="hero-inner" id="heroInner"></div>
    <button class="scroll-cue" id="scrollCue" type="button">
      <span id="scrollCueText">Scroll for demo</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </section>

  <section class="slide-screen demo-section" id="demo">
    <header class="page-head">
      <div class="brand-row">
        <div class="brand-mark">
          <svg viewBox="0 0 100 100" fill="none"><path d="M20 65 L38 35 L52 55 L65 30 L80 60" stroke="#4a9eff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <a class="brand-name brand-link" href="https://github.com/WowCatQwerty/vps-net-stat" target="_blank" rel="noopener">vps-net-stat</a>
          <span class="brand-tag" id="brandTag">— interactive demo menu</span>
        </div>
      </div>
    </header>

  <div class="term-wrap">
    <div class="term-card">
      <div class="term-titlebar">
        <div class="term-dots"><span></span><span></span><span></span></div>
        <div class="term-title" id="termTitleLabel">root<span style="color:var(--text-faint)">@</span><b>demo-vps</b><span style="color:var(--text-faint)">:~#</span></div>
        <div class="term-actions">
          <button id="langBtn" title="Switch language">EN</button>
          <button id="resetBtn" title="Reset demo to a fresh install state">↺ reset</button>
        </div>
      </div>
      <div class="term-body" id="termBody"></div>
      <div class="term-hint" id="termHint">
        <span>Type <kbd>vns</kbd> and press <kbd>Enter</kbd> to open the menu</span>
        <span><kbd>↑</kbd>/<kbd>↓</kbd> command history</span>
      </div>
    </div>
  </div>

  </section>
</div>

<script src="demo.js?v=8"></script>
</body>
</html>
